name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, contract types, typecheck, tests (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the check pipeline inside the dev image against the compose Redis
        run: docker compose run --rm --build test npm run check
      - if: always()
        run: docker compose down -v

  smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image and start it with Redis
        run: docker compose -f compose.prod.yaml up --build --wait app
      - name: Black-box smoke suite against the running container
        run: docker compose -f compose.prod.yaml run --rm --build smoke
      - if: always()
        run: |
          docker compose -f compose.prod.yaml logs app
          docker compose -f compose.prod.yaml down -v
