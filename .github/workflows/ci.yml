name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, contract types, typecheck, tests (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - if: always()
        run: make down

  smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
      - if: failure()
        run: docker compose -f compose.prod.yaml logs app || true
      - if: always()
        run: make prod-down
