name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, contract types, typecheck, tests (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - if: always()
        run: make down

  smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
      - if: failure()
        run: docker compose -f compose.prod.yaml logs app || true
      - if: always()
        run: make prod-down

  deploy:
    name: Deploy to Fly.io
    needs: [check, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_APP != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Record the currently deployed image (for rollback)
        run: fly releases --app "$FLY_APP" --json | head -c 2000 || true
      - name: Build, push and deploy the exact runtime image
        run: make deploy FLY_APP="$FLY_APP"
      - name: Smoke test the live deployment
        run: make smoke-remote FLY_APP="$FLY_APP" ADMIN_TOKEN="${{ secrets.ADMIN_TOKEN }}"
