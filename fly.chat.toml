# Fly.io configuration for the chat server. Secrets (REDIS_URL, JWT_SECRET, SEED_USERS) are set
# with `fly secrets set --app convert-digital-chat`; CI deploys the runtime-chat image by tag (see `make deploy-chat`).
app = "convert-digital-chat"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime-chat"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_FILE = "/data/chat.db"
  TRUST_PROXY = "true"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  FAILURE_POLICY = "open"

# SQLite lives on a persistent volume; one Machine, so a single writer.
[mounts]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["app"]

[deploy]
  strategy = "rolling"
