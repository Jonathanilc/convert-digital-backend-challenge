# Fly.io configuration for the rate-limiter demo API.
#
# Secrets are never here. Set them once with:
#   fly secrets set REDIS_URL=... ADMIN_TOKEN=... DEMO_USERS=id:password:token
#
# CI builds the runtime image, pushes it to registry.fly.io/<app>:<sha> and deploys that exact
# image with `fly deploy --image` (see `make deploy`). The [build] section below is only used by a
# manual `fly deploy` from source.
app = "convert-digital-rate-limiter"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Fly's proxy terminates TLS; Fly-Client-IP is set by Fly and cannot be forged by clients.
  TRUST_PROXY = "true"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  FAILURE_POLICY = "open"
  RATE_LIMIT_ALGORITHM = "fixed-window"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Rolling deploys only move on once a new Machine answers this.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["app"]

[deploy]
  strategy = "rolling"
